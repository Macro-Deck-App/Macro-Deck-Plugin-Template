name: Publish

# Publishes MacroDeck.Plugin.Templates to nuget.org on every push to main. The version lives in
# packaging/MacroDeck.Plugin.Templates.csproj, so a release is a version bump in that file: a push that
# does not change it re-packs the same version and the push is skipped as a duplicate.
#
# This file is the only place NuGet/login appears. Trusted publishing validates the workflow file the
# login step runs in, so the nuget.org policy names publish.yml and nothing else.

on:
  push:
    branches: [ main ]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to NuGet
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job request the OIDC token nuget.org exchanges for a short-lived API key.
      id-token: write
    steps:
      # secrets are not available to a job-level if, so the gate is a step that exports the decision.
      - name: Check nuget.org credentials
        id: credentials
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -n "${NUGET_USER}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::NUGET_USER is not configured - skipping the NuGet push. The package remains available as a workflow artifact."

      - name: Download package
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: template-package
          path: ${{ runner.temp }}/packages

      - uses: actions/setup-dotnet@v6
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # As late as possible: the issued key is valid for one hour, and one token yields one key.
      - name: NuGet login
        id: login
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate is what makes "publish on every push to main" workable: only a commit that
      # bumped the version in packaging/MacroDeck.Plugin.Templates.csproj actually publishes anything.
      - name: Push package
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_DIR: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          for package in "${PACKAGE_DIR}"/*.nupkg; do
            echo "Pushing $(basename "${package}")"
            dotnet nuget push "${package}" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Summarize
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          PACKAGE_DIR: ${{ runner.temp }}/packages
        run: |
          {
            echo "## Published to NuGet"
            echo
            for package in "${PACKAGE_DIR}"/*.nupkg; do
              echo "- \`$(basename "${package}")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
